server:
  port: 8080
spring:
  application:
    name: product-ms
  datasource:
    url: jdbc:h2:mem:productdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: "/h2-console"
  jpa:
    hibernate:
      ddl-auto: 'create-drop'
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

